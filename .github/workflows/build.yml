name: Build Avisblue Images

on:
  schedule:
    # Daily 06:00 UTC — picks up Aurora-dx upstream rebuild same-day
    - cron: "0 6 * * *"
  workflow_dispatch:
  # Validate every PR by actually building + smoke-testing both images. PR runs
  # push ONLY the :<sha> tag (never :latest) and skip sign/verify/revert, so the
  # fleet — which follows :latest — is never affected by an unmerged branch.
  pull_request:

# Cancel superseded PR builds (rapid review-fix pushes) to save runner minutes;
# never cancel scheduled/dispatch prod builds.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Shellcheck build scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38  # 2.0.0
        with:
          scandir: './build_files'
          severity: warning

      - name: Shellcheck repo scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38  # 2.0.0
        with:
          scandir: './scripts'
          severity: warning

      - name: Actionlint workflow files
        uses: reviewdog/action-actionlint@be0761e4c1bab7cfdfca56cd03d4bb6253e39a4a  # v1.72.0
        with:
          fail_level: error
          reporter: github-check

  build:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: avisblue
            containerfile: Containerfile
            base: ghcr.io/ublue-os/aurora-dx:stable
            variant: Main
          - image: avisblue-nvidia
            containerfile: Containerfile.nvidia
            base: ghcr.io/ublue-os/aurora-dx-nvidia-open:stable
            variant: NVIDIA
    steps:
      - name: Free disk space
        run: |
          echo "Before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
          echo "After cleanup:"
          df -h /

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Compute build date
        id: date
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      # Tag set differs by trigger: prod builds (schedule/dispatch) move :latest
      # AND pin :<sha>; PR builds push ONLY :<sha> so the fleet's :latest pointer
      # is never touched by an unmerged branch. The smoke test pulls :<sha> in
      # both cases, so PRs get the identical end-to-end validation minus signing.
      - name: Compute image tags
        id: tags
        env:
          REG: ${{ env.IMAGE_REGISTRY }}
          IMG: ${{ matrix.image }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          {
            echo "tags<<EOF"
            echo "${REG}/${IMG}:${SHA}"
            if [[ "$EVENT" != "pull_request" ]]; then
              echo "${REG}/${IMG}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: .
          file: ${{ matrix.containerfile }}
          push: true
          # buildx defaults attach provenance + sbom, converting push into a
          # multi-arch index. cosign then signs the index digest, but bootc
          # looks up sig by platform-manifest digest -> mismatch -> pull fails
          # "A signature was required, but no signature exists". Disabled per
          # VISION §8: no supply-chain scanners for a single-owner derivative.
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
            BUILD_DATE=${{ steps.date.outputs.date }}
            BUILD_ID=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Phase G — G1: pull the freshly-pushed image and run a curated
      # branding/identity/signing-policy manifest check. Catches dnf-swap
      # clobbering, stash-restore failures, frame-count drift, and policy.json
      # gaps before sign + fleet pull. See scripts/smoke-test.sh.
      - name: Smoke test ${{ matrix.image }}
        env:
          IMAGE_REF: ${{ env.IMAGE_REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
          VARIANT: ${{ matrix.variant }}
        run: bash scripts/smoke-test.sh "$IMAGE_REF" "$VARIANT"

  sign:
    runs-on: ubuntu-latest
    needs: build
    # Sign + ship only for prod builds. PR validation builds push :<sha> for the
    # smoke test but are never signed (and the fleet never pulls them), so skip.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pinned to cosign-installer v3.10.1 (= cosign v2.6.1) on 2026-05-08
      # because cosign v3 default `--registry-referrers-mode=oci-1-1` writes
      # the new `application/vnd.dev.sigstore.bundle.v0.3+json` referrer
      # artifact at tag `sha256-DIGEST` (no `.sig` suffix), which the
      # base-shipped containers-image (Fedora 44, containers-common 0.67,
      # bootc 1.15.1) cannot verify — `bootc upgrade` fails fleet-wide with
      # "A signature was required, but no signature exists". The v3 opt-out
      # flags `--registry-referrers-mode=legacy` and `--use-signing-config=false`
      # were tried (commit a0d8644) and did not actually change cosign's
      # output. Bluefin / bazzite-dx use the same v3.10.1 pin in production.
      # Re-evaluate when Fedora 45+ ships a containers-image that handles
      # the v0.3 sigstore bundle format.
      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5  # v3.10.1

      - name: Sign images
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          REGISTRY: ${{ env.IMAGE_REGISTRY }}
          SHA: ${{ github.sha }}
        run: |
          # cosign v2 default uploads to Rekor; --tlog-upload=false keeps the
          # signature offline (Avisblue ships no Rekor reference).
          for image in avisblue avisblue-nvidia; do
            cosign sign --key env://COSIGN_PRIVATE_KEY --yes \
              --tlog-upload=false \
              "${REGISTRY}/${image}:latest"
            cosign sign --key env://COSIGN_PRIVATE_KEY --yes \
              --tlog-upload=false \
              "${REGISTRY}/${image}:${SHA}"
          done

      # Phase G — G2: verify each tag's sig is reachable with our public key
      # AND that :latest resolved to a single-platform manifest, not an
      # OCI/Docker index. The latter would mean cosign signed the index digest
      # while bootc upgrade resolves index -> platform and looks up sig at
      # the platform digest -> miss -> fleet pull fails with "A signature was
      # required, but no signature exists" (commit c5993b0, 2026-05-08).
      - name: Verify signature chain
        env:
          REGISTRY: ${{ env.IMAGE_REGISTRY }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for image in avisblue avisblue-nvidia; do
            LATEST="${REGISTRY}/${image}:latest"
            SHA_REF="${REGISTRY}/${image}:${SHA}"

            # cosign v3 default expects a Rekor tlog entry; we sign offline
            # without uploading -> --insecure-ignore-tlog=true is required.
            cosign verify --key cosign.pub --insecure-ignore-tlog=true "$LATEST" >/dev/null
            cosign verify --key cosign.pub --insecure-ignore-tlog=true "$SHA_REF" >/dev/null
            echo "OK: ${image} signatures verify against cosign.pub"

            mt=$(skopeo inspect --raw "docker://$LATEST" | jq -r '.mediaType')
            case "$mt" in
              application/vnd.oci.image.manifest.v1+json|application/vnd.docker.distribution.manifest.v2+json)
                echo "OK: ${image}:latest is single-platform manifest ($mt)" ;;
              application/vnd.oci.image.index.v1+json|application/vnd.docker.distribution.manifest.list.v2+json)
                echo "FAIL: ${image}:latest is a multi-arch index ($mt)." >&2
                echo "  bootc resolves index -> platform manifest and looks up" >&2
                echo "  signature at the platform digest. Signature is attached" >&2
                echo "  to the index digest. Fleet pull will fail." >&2
                echo "  Fix: provenance:false + sbom:false in build-push-action." >&2
                exit 1 ;;
              *)
                echo "FAIL: ${image}:latest mediaType not recognised: $mt" >&2
                exit 1 ;;
            esac
          done

  # Phase G — G3: if a scheduled or workflow_dispatch run goes red anywhere
  # in build/sign, retag the previous green SHA as :latest and open a tracking
  # issue. Fleet stays on last-known-good while Q investigates. Deliberately
  # NOT triggered on pull_request — preview pushes shouldn't revert prod.
  auto-revert:
    if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      issues: write
      actions: read
    steps:
      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Find last green SHA on main
        id: green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # status=success guarantees this is not the current failing run.
          sha=$(gh api \
            "repos/${REPO}/actions/workflows/build.yml/runs?status=success&branch=main&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')
          if [[ -z "$sha" ]]; then
            echo "FAIL: no prior successful run on main found; cannot revert :latest" >&2
            exit 1
          fi
          echo "Last green SHA: $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Retag previous green as :latest
        env:
          REGISTRY: ${{ env.IMAGE_REGISTRY }}
          GREEN: ${{ steps.green.outputs.sha }}
        run: |
          set -euo pipefail
          # skopeo copy preserves the source manifest format (single-platform
          # stays single-platform). `docker buildx imagetools create` does NOT
          # — it wraps the source in a manifest LIST, changing the digest at
          # :latest. The cosign signature is attached to the original
          # single-platform digest, so wrapping breaks bootc's sig lookup
          # (the c5993b0-class regression). skopeo copies the manifest verbatim
          # to the new tag, so :latest's digest matches the signed digest.
          for image in avisblue avisblue-nvidia; do
            echo "Retagging ${image}: ${GREEN} -> latest"
            skopeo copy --quiet \
              "docker://${REGISTRY}/${image}:${GREEN}" \
              "docker://${REGISTRY}/${image}:latest"
          done

      - name: Open tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          FAILED_SHA: ${{ github.sha }}
          GREEN_SHA: ${{ steps.green.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Idempotent label setup so the very first auto-revert doesn't fail
          # on missing labels. Already-exists is non-fatal.
          gh --repo "$REPO" label create automated --color ededed \
            --description "Opened by automation" 2>/dev/null || true
          gh --repo "$REPO" label create build-failure --color d73a4a \
            --description "CI build/sign failure" 2>/dev/null || true

          short_failed="${FAILED_SHA:0:7}"
          short_green="${GREEN_SHA:0:7}"
          body="Failed run: ${RUN_URL}
          Failed SHA: \`${FAILED_SHA}\`
          Restored SHA: \`${GREEN_SHA}\`

          Fleet \`:latest\` retagged to \`${short_green}\` so machines stay on last-known-good while this is investigated.

          Phase G auto-revert (VISION §8a / Theme G)."
          gh --repo "$REPO" issue create \
            --title "Auto-revert: build for ${short_failed} failed; :latest restored to ${short_green}" \
            --label automated,build-failure \
            --body "$body"
