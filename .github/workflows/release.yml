name: Release Avisblue ISOs

on:
  schedule:
    # Mondays 08:00 UTC — after upstream Bazzite (Mon 04:40) and our daily image (06:00)
    - cron: "0 8 * * 1"
  workflow_dispatch:

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  PUBLISH_HOST: pool-nas
  PUBLISH_USER: avisblue-ci
  PUBLISH_ROOT: /mnt/POOL/fleet/avisblue
  RETENTION_DAYS: 30

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image:
          - avisblue-main
          - avisblue-nvidia-gaming
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull the base image and read VERSION_ID from /usr/lib/os-release.
      # jasonn3/build-container-installer plumbs `version` into the Lorax
      # checkout (lorax-${version}.* tag) + Anaconda installer assets; it MUST
      # match the rootfs's Fedora major or the ISO is broken (kernel/glibc/
      # libfuse ABI skew). Single source-of-truth: same field 80-avisblue.sh
      # reads at image build. Hard-fails on non-numeric per RULE 0.
      - name: Detect Fedora version from base
        id: fedora
        env:
          BASE: ${{ env.IMAGE_REGISTRY }}/${{ matrix.image }}:latest
        run: |
          set -euo pipefail
          podman pull "$BASE"
          VID=$(podman run --rm "$BASE" \
            sh -c '. /usr/lib/os-release && echo "$VERSION_ID"')
          if [[ ! "$VID" =~ ^[0-9]+$ ]]; then
            echo "ERROR: VERSION_ID not numeric: '$VID'" >&2
            exit 1
          fi
          echo "version=$VID" >> "$GITHUB_OUTPUT"
          echo "Detected Fedora $VID from $BASE"

      - name: Build ISO
        uses: jasonn3/build-container-installer@c9ef3de33236e66781ec37bd0485e8009eaefe24  # v1.4.0
        with:
          image_name: ${{ matrix.image }}
          image_repo: ${{ env.IMAGE_REGISTRY }}
          image_tag: latest
          version: ${{ steps.fedora.outputs.version }}
          variant: Kinoite
          iso_name: ${{ matrix.image }}.iso

      # Pinned to cosign-installer v3.10.1 (= cosign v2.6.1) to match
      # build.yml. v3.x output format breaks bootc-side sig verification
      # (Bazzite containers-image still on legacy schema). See sign-step
      # comment in build.yml for full rationale.
      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5  # v3.10.1

      - name: Checksum + sign ISO
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          IMAGE: ${{ matrix.image }}
        run: |
          sha256sum "${IMAGE}.iso" > "${IMAGE}.iso.sha256"
          cosign sign-blob \
            --key env://COSIGN_PRIVATE_KEY \
            --tlog-upload=false \
            --output-signature "${IMAGE}.iso.sig" \
            --yes \
            "${IMAGE}.iso"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.image }}-iso
          path: |
            ${{ matrix.image }}.iso
            ${{ matrix.image }}.iso.sha256
            ${{ matrix.image }}.iso.sig
          retention-days: 1
          compression-level: 0

  publish:
    needs: build-iso
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set release date tag
        id: date
        run: echo "tag=v$(date +%Y.%m.%d)" >> "$GITHUB_OUTPUT"

      - name: Download all ISO artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          path: artifacts

      - name: Stage release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.iso' -o -name '*.sha256' -o -name '*.sig' \) \
            -exec mv {} release-assets/ \;
          echo "Assets staged:"
          ls -lh release-assets/

      - name: Join tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8  # v4.1.2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Install publish SSH key
        env:
          SSH_KEY: ${{ secrets.PUBLISH_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Publish to pool-nas
        env:
          TAG: ${{ steps.date.outputs.tag }}
        run: |
          set -euo pipefail
          SSH_OPTS="-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR"
          REMOTE="${PUBLISH_USER}@${PUBLISH_HOST}"

          # shellcheck disable=SC2086  # SSH_OPTS must word-split
          ssh $SSH_OPTS "$REMOTE" "mkdir -p '${PUBLISH_ROOT}/${TAG}'"

          # shellcheck disable=SC2086
          rsync -rtvz --partial \
            --chmod=F644,D755 \
            -e "ssh $SSH_OPTS" \
            release-assets/ \
            "${REMOTE}:${PUBLISH_ROOT}/${TAG}/"

          # shellcheck disable=SC2086
          ssh $SSH_OPTS "$REMOTE" "ln -sfn '${TAG}' '${PUBLISH_ROOT}/latest'"

          echo "=== Published ==="
          # shellcheck disable=SC2086
          ssh $SSH_OPTS "$REMOTE" "ls -lh '${PUBLISH_ROOT}/${TAG}/' && readlink '${PUBLISH_ROOT}/latest'"

      - name: Prune releases older than retention window
        env:
          TAG: ${{ steps.date.outputs.tag }}
        run: |
          set -euo pipefail
          SSH_OPTS="-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR"
          REMOTE="${PUBLISH_USER}@${PUBLISH_HOST}"

          # shellcheck disable=SC2086
          ssh $SSH_OPTS "$REMOTE" "
            set -e
            cd '${PUBLISH_ROOT}'
            find . -mindepth 1 -maxdepth 1 -type d -name 'v*' \
              -not -name '${TAG}' \
              -mtime +${RETENTION_DAYS} \
              -print -exec rm -rf {} +
          "
