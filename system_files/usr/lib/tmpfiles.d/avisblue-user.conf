# Avisblue first-boot user environment materialisation (VISION §8b).
# Force-symlink Avisblue-managed user defaults from /usr/share/avisblue/skel/
# into ~/.config/. Runs on every user manager startup via the systemd-shipped
# systemd-tmpfiles-setup.service user unit, so rebases that ship new file
# content propagate on next login (the symlink target moves with the image).
#
# Naming: 00-avisblue-* sorts first within each directory; users override
# with their own higher-numbered files in the same directory (environment.d
# uses last-definition-wins for env-var assignment).

d %h/.config/environment.d 0755 - - -
L+ %h/.config/environment.d/00-avisblue-ssh-agent.conf - - - - /usr/share/avisblue/skel/.config/environment.d/00-avisblue-ssh-agent.conf
L+ %h/.config/environment.d/00-avisblue-wayland.conf - - - - /usr/share/avisblue/skel/.config/environment.d/00-avisblue-wayland.conf
